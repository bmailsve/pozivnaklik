# Poziv na klik on Netlify
#   main    branch → production (pozivnaklik.com)
#   staging branch → staging (staging--<site>.netlify.app), its own database and photo store
# The page is built by Vite into dist/. The API (/api), photos (/media, /og) and guest links (/i)
# are Netlify Functions (netlify/functions). Data: Postgres at DATABASE_URL, set per deploy context.

[build]
  command = "node scripts/prepare-deploy.mjs && npm test && npm run build"
  publish = "dist"
  # the staging password page (only in non-production builds, see scripts/prepare-deploy.mjs)
  edge_functions = ".netlify-edge"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["config.json", "dist/index.html"]
  # pg is loaded from node_modules as-is (it has an optional native part esbuild can't bundle)
  external_node_modules = ["pg"]

# Built files have a content hash in their name: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself is always checked for a newer version.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# APP_ENV (production / staging) follows the deploy context automatically; it can be set
# per context in the Netlify UI too. Staging pages are marked noindex at build time (vite.config.js).
