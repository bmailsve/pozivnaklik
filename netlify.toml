# Poziv na klik on Netlify: the page is served from /public, the API runs as a Netlify Function
# (netlify/functions/api.mjs) and keeps accounts, invitations and replies in Netlify Blobs.
[build]
  command = "echo 'No build step needed'"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["config.json"]

# Guest links (/i/<code>) and their preview pictures (/og/<code>.jpg) are served by
# netlify/functions/page.mjs, so WhatsApp and Viber show the invitation's title and picture.

# Always load the newest version of the page (no stale copies in browsers)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
